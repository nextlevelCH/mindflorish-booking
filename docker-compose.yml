# Buchungsbestätigung Mindflorish auf dem VPS, HTTPS über die bestehende Traefik-Instanz.
# Traefik erreicht den Container ohne gemeinsames Netz, wie bei der Meeting-App.
services:
  mindflorish-booking:
    image: ghcr.io/nextlevelch/mindflorish-booking:latest
    container_name: mindflorish-booking
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mindflorish-booking.rule=Host(`booking.mindflorish.ch`)"
      - "traefik.http.routers.mindflorish-booking.entrypoints=websecure"
      - "traefik.http.routers.mindflorish-booking.tls.certresolver=letsencrypt"
      - "traefik.http.services.mindflorish-booking.loadbalancer.server.port=80"
    # Einwilligungs-Protokoll bleibt beim Neu-Bereitstellen erhalten
    volumes:
      - consent-log:/var/log/consent

volumes:
  consent-log:
