# Einwilligungs-Protokoll: nur gültige Einträge, ohne IP-Adresse
map $arg_id $consent_ok {
    "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" 1;
    default 0;
}
log_format consent escape=json '{"time":"$time_iso8601","status":"$status","id":"$arg_id","version":"$arg_v","stats":"$arg_stats","marketing":"$arg_mkt","action":"$arg_action","lang":"$arg_lang"}';
# Drosselung gegen Massenanfragen, Schlüssel nur im Arbeitsspeicher
limit_req_zone $http_x_forwarded_for zone=consent:1m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Weiterleitungen, damit /en nicht auf http und Port 80 zeigt
    absolute_redirect off;
    # Keine Zugriffsprotokolle mit IP-Adressen, Fehler landen weiter im Docker-Log
    access_log off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # add_header in einem location-Block ersetzt die äusseren, deshalb pro Block einbinden
    location = / {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /en {
        return 301 /en/;
    }

    location = /en/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /en/index.html =404;
    }

    location = /consent {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-store" always;
        limit_req zone=consent burst=10 nodelay;
        limit_req_status 429;
        access_log /var/log/consent/consent.log consent if=$consent_ok;
        return 204;
    }

    location /assets/ {
        include /etc/nginx/headers.conf;
        expires 7d;
    }

    location / {
        include /etc/nginx/headers.conf;
        try_files $uri $uri/ =404;
    }
}
