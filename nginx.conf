server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Weiterleitungen, damit /en nicht auf http und Port 80 zeigt
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # add_header in einem location-Block ersetzt die äusseren, deshalb pro Block einbinden
    location = / {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /en {
        return 301 /en/;
    }

    location = /en/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /en/index.html =404;
    }

    location /assets/ {
        include /etc/nginx/headers.conf;
        expires 7d;
    }

    location / {
        include /etc/nginx/headers.conf;
        try_files $uri $uri/ =404;
    }
}
